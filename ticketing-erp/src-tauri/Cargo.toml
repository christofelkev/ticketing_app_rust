[package]
name = "ticketing-erp"
version = "1.0.0"
description = "Sistem Ticketing ERP Lokal — PT SEKAI ID"
authors = ["PT SEKAI ID"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Auth
bcrypt = "0.15"

# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
once_cell = "1"

# Excel export (Fase 4)
# rust_xlsxwriter = "0.64"
